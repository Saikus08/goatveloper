        - generic [ref=e55]:
          - heading "Why This Exists" [level=2] [ref=e56]
          - paragraph [ref=e57]: The point of this site is to make learning visible. Reading, watching, and experimenting all help, but writing forces me to decide what I actually understood.
          - paragraph [ref=e58]: This blog is also meant to become a software engineering profile. Instead of only saying what I know, I want to show how I approach problems, tradeoffs, bugs, architecture, and career decisions.
          - complementary [ref=e59]:
            - strong [ref=e60]: Current decision
            - paragraph [ref=e62]: "The site starts with repo-based writing. That keeps articles close to the same workflow I use as an engineer: edit, review the diff, commit, and publish."
          - heading "What I Want To Publish" [level=2] [ref=e63]
          - paragraph [ref=e64]: "I want the writing here to stay close to real work:"
          - list [ref=e65]:
            - listitem [ref=e66]: short notes when a concept finally clicks
            - listitem [ref=e67]: deeper explanations after I use something in a project
            - listitem [ref=e68]: debugging stories with the actual investigation path
            - listitem [ref=e69]: project case studies that explain decisions and tradeoffs
            - listitem [ref=e70]: career reflections grounded in what I am building
          - heading "The Writing Workflow" [level=2] [ref=e71]
          - paragraph [ref=e72]: "Articles are stored as Markdown or MDX files in the repo. That keeps the writing workflow close to software engineering: edit locally, review the diff, commit the change, and publish from Git."
          - paragraph [ref=e73]: Markdown is enough for most posts. MDX is available for posts that need interactive examples or custom components.
